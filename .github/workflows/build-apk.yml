name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project archive
        shell: bash
        run: |
          set -e
          PROJECT_ARCHIVE=$(find . -maxdepth 1 -type f -name 'NORD_ANDROID_PROJECT_BASE*.zip' | head -n 1)
          if [ -z "$PROJECT_ARCHIVE" ] && [ -f Nord_Novaya_Sudba_PROJECT1.zip ]; then
            PROJECT_ARCHIVE=Nord_Novaya_Sudba_PROJECT1.zip
          fi
          if [ -z "$PROJECT_ARCHIVE" ]; then
            echo "No project ZIP found" >&2
            exit 1
          fi
          echo "PROJECT_ARCHIVE=$PROJECT_ARCHIVE" >> "$GITHUB_ENV"
          echo "Using $PROJECT_ARCHIVE"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "$PROJECT_ARCHIVE" -d project

      - name: Apply direct NORD patches
        shell: bash
        run: |
          set -e
          python3 patches/apply_nord_patches.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v40.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v41.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v42.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v43.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v44.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v45.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v46.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v47.py project/app/src/main/assets/index.html
          python3 patches/apply_nord_v48.py project/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nord-novaya-sudba-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project archive
        shell: bash
        run: |
          set -e
          if [ -f NORD_ANDROID_PROJECT_BASE.zip ]; then
            echo "PROJECT_ARCHIVE=NORD_ANDROID_PROJECT_BASE.zip" >> "$GITHUB_ENV"
          elif [ -f Nord_Novaya_Sudba_PROJECT1.zip ]; then
            echo "PROJECT_ARCHIVE=Nord_Novaya_Sudba_PROJECT1.zip" >> "$GITHUB_ENV"
          else
            echo "No project ZIP found" >&2
            exit 1
          fi

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "$PROJECT_ARCHIVE" -d project

      - name: Apply direct patches
        shell: bash
        run: |
          set -e
          if [ -d patches ]; then
            echo "Applying direct patches..."
            cp -a patches/. project/
          else
            echo "No patches directory; building base project"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nord-novaya-sudba-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
